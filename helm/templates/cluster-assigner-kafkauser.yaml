{{- if .Values.clusterAssigner.enabled }}
{{- if .Values.clusterAssigner.kafkaUser.enabled }}
# Strimzi KafkaUser for the cluster assigner's mTLS Kafka auth. It writes the
# <topicPrefix>-agent-task-v1-request topic only. Lives in the Strimzi
# operator's namespace (not the app namespace) and is labelled with the target
# Kafka cluster. Off by default — non-Strimzi clusters manage Kafka auth
# outside the chart.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ .Values.clusterAssigner.kafkaUser.userName | default (printf "%s-cluster-assigner" (include "agent.namespace" .)) }}
  namespace: {{ .Values.clusterAssigner.kafkaUser.strimziNamespace | default "strimzi" }}
  labels:
    strimzi.io/cluster: {{ .Values.clusterAssigner.kafkaUser.cluster | default "my-cluster" }}
    {{- include "agent.labels" . | nindent 4 }}
spec:
  authentication:
    type: tls
{{- end }}
{{- end }}
