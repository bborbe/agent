{{- if and .Values.a2aWorkerController.enabled (not .Values.a2aWorkerController.existingSecret) }}
{{- $a := .Values.a2aWorkerController }}
{{- $name := printf "a2a-worker-controller-%s" $a.name | trunc 63 | trimSuffix "-" }}
---
# Created only when no existingSecret is referenced. Every value here is supplied by the
# caller at apply time — the cluster resolves it from TeamVault and passes it via
# --set-string, so no secret is ever committed to a values file.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ include "agent.namespace" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  a2a-auth-token: {{ required "a2aWorkerController.authToken is required (or set existingSecret)" $a.authToken | b64enc | quote }}
  teamvault-user: {{ required "a2aWorkerController.teamvaultUser is required (or set existingSecret)" $a.teamvaultUser | b64enc | quote }}
  teamvault-pass: {{ required "a2aWorkerController.teamvaultPass is required (or set existingSecret)" $a.teamvaultPass | b64enc | quote }}
  sentry-dsn: {{ $a.sentry.dsn | b64enc | quote }}
{{- end }}
