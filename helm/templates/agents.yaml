{{- range $agent := .Values.agents }}
{{- if $agent.enabled }}
{{- $storageNamespace := "" }}
{{- if and ($.Values.sandbox | default dict).renderAgentStorage $.Values.executor.enabled }}
{{- $storageNamespace = include "agent.agentStorageNamespace" (dict "root" $ "agent" $agent) }}
{{- end }}
---
apiVersion: agent.benjamin-borbe.de/v1
kind: Config
metadata:
  name: {{ $agent.name }}
  namespace: {{ include "agent.namespace" $ }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
spec:
  assignee: {{ $agent.assignee | quote }}
  taskTypes:
    {{- toYaml $agent.taskTypes | nindent 4 }}
  priorityClassName: {{ $agent.name }}
  image: {{ printf "%s/%s:%s" $.Values.image.registry $agent.image ($agent.tag | default $.Chart.AppVersion) | quote }}
  heartbeat: {{ $agent.heartbeat | quote }}
  {{- with $agent.type }}
  type: {{ . | quote }}
  {{- end }}
  secretName: {{ $agent.secretName | default $agent.name }}
  {{- if $agent.maxConcurrentJobs }}
  maxConcurrentJobs: {{ $agent.maxConcurrentJobs }}
  {{- end }}
  {{- if $agent.zombieJobTimeoutSeconds }}
  zombieJobTimeoutSeconds: {{ $agent.zombieJobTimeoutSeconds }}
  {{- end }}
  {{- if hasKey $agent "rerunOnLostClaim" }}
  rerunOnLostClaim: {{ $agent.rerunOnLostClaim }}
  {{- end }}
  {{- with $agent.jobNamespace }}
  jobNamespace: {{ . | quote }}
  {{- end }}
  {{- if $agent.volumeMountPath }}
  {{- if ne ($agent.type | default "job") "service" }}
  volumeClaim: {{ $agent.volumeClaim | default $agent.name }}
  {{- end }}
  volumeMountPath: {{ $agent.volumeMountPath | quote }}
  {{- end }}
  {{- with $agent.configMapName }}
  configMapName: {{ . | quote }}
  {{- end }}
  {{- with $agent.configMapMountPath }}
  configMapMountPath: {{ . | quote }}
  {{- end }}
  {{- with $agent.configMapItems }}
  configMapItems:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $sentryProxy := ($agent.sentry | default dict).proxy | default $.Values.sentry.proxy }}
  {{- $env := dict }}
  {{- with $agent.env }}
  {{-   $env = mergeOverwrite $env . }}
  {{- end }}
  {{- /* Proxy env only for Job agents, and only when the install has opted in.
         A `type: service` agent runs as a StatefulSet in the control namespace,
         which `egress-proxy-ingress` does not admit. And until spec 002 makes the
         executor spawn Jobs into <ns>-agents-sandbox, Job agents run in the
         control namespace too — so the default is OFF, or every agent would be
         pointed at a proxy that denies it. */}}
  {{- /* sandbox.renderPolicies=false omits the proxy Service, so the env would
         name a host that does not exist; it follows the proxy. */}}
  {{- if and (eq (toString $.Values.egressProxy.injectAgentEnv) "true") $.Values.executor.enabled (include "agent.sandboxRenderPolicies" $) (ne (toString ($agent.type | default "job")) "service") }}
  {{-   $env = mergeOverwrite $env (include "agent.proxyEnv" $ | fromYaml) }}
  {{- end }}
  {{- if and $sentryProxy (not (hasKey $env "SENTRY_PROXY")) }}
  {{-   $env = mergeOverwrite $env (dict "SENTRY_PROXY" $sentryProxy) }}
  {{- end }}
  {{- if $env }}
  env:
    {{- toYaml $env | nindent 4 }}
  {{- end }}
  trigger:
    phases:
      {{- toYaml $agent.triggerPhases | nindent 6 }}
    statuses:
      {{- toYaml $agent.triggerStatuses | nindent 6 }}
  {{- with $agent.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if $agent.secretEnv }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $agent.name }}
  namespace: {{ include "agent.namespace" $ }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
data:
  {{- range $k, $v := $agent.secretEnv }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- if $storageNamespace }}
---
# Sandbox copy (sandbox.renderAgentStorage). The control-namespace Secret above
# stays put — the executor reads it from there. Only chart-rendered Secrets are
# copied; an agent pointing `secretName` at an externally managed Secret renders
# none here and the operator must place that Secret by hand.
# With `sandbox.domains` declared this copy follows the agent's `jobNamespace`
# and renders only when that names a declared domain; with no domains it targets
# the single sandbox namespace regardless of `jobNamespace`.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $agent.name }}
  namespace: {{ $storageNamespace }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
data:
  {{- range $k, $v := $agent.secretEnv }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and $agent.volumeMountPath (ne ($agent.type | default "job") "service") }}
---
# PVC only when the agent mounts a volume (some agents — e.g. a stateless
# backtest runner — declare no volumeMountPath and get no claim). A service
# agent is excluded: the executor's StatefulSet provisions its own volume from
# volumeClaimTemplates, so a claim rendered here would be a second, unmounted
# one — and spec.volumeClaim is ignored on that path, so it would be invisible.
# resource-policy keep: a stale apply whose render drops this claim must not
# delete it. Helm reads the policy from the LIVE object at prune time, so it
# protects only once an apply of this chart has written it onto the claim. It
# also keeps the claim on `helm uninstall` and when the agent leaves values —
# clean up by hand: kubectl delete pvc <volumeClaim|name> -n <namespace>.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $agent.volumeClaim | default $agent.name }}
  namespace: {{ include "agent.namespace" $ }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $agent.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $agent.storageSize | default "1Gi" }}
{{- if $storageNamespace }}
---
# Sandbox copy (sandbox.renderAgentStorage). This is a NEW, EMPTY volume in the
# sandbox namespace — NOT a view of the control-namespace claim above, so data
# written to the original is not visible here. `resource-policy: keep` matches
# the original: a render that drops this claim must not delete it.
# With `sandbox.domains` declared this copy follows the agent's `jobNamespace`
# and renders only when that names a declared domain; with no domains it targets
# the single sandbox namespace regardless of `jobNamespace`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $agent.volumeClaim | default $agent.name }}
  namespace: {{ $storageNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $agent.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $agent.storageSize | default "1Gi" }}
{{- end }}
{{- end }}
---
# PriorityClass is cluster-scoped (no namespace). Named per-agent so the
# ResourceQuota below can cap concurrent pods of exactly this agent.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $agent.name }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
value: {{ $agent.priorityValue | default 500 }}
globalDefault: false
preemptionPolicy: Never
description: "Priority class for agent {{ $agent.name }}"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $agent.name }}
  namespace: {{ include "agent.namespace" $ }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
spec:
  hard:
    pods: "{{ $agent.concurrency | default 1 }}"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - {{ $agent.name }}
{{- end }}
{{- end }}
