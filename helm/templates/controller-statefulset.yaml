{{- range $c := .Values.controllers }}
{{- if $c.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-task-controller-{{ $c.name }}
  namespace: {{ include "agent.namespace" $ }}
  labels:
    app: agent-task-controller-{{ $c.name }}
    {{- include "agent.labels" $ | nindent 4 }}
  annotations:
    {{- if $.Values.keel.enabled }}
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: {{ $.Values.keel.pollSchedule | quote }}
    {{- end }}
    {{- with $.Values.rolloutNonce }}
    random: {{ . | quote }}
    {{- end }}
spec:
  replicas: 1
  serviceName: agent-task-controller-{{ $c.name }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: agent-task-controller-{{ $c.name }}
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
        {{- with $.Values.rolloutNonce }}
        random: {{ . | quote }}
        {{- end }}
      labels:
        app: agent-task-controller-{{ $c.name }}
    spec:
      {{- with $c.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: service
          image: {{ printf "%s/%s:%s" $.Values.image.registry (($c.image | default dict).repository | default "bborbe/agent-task-controller") (($c.image | default dict).tag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $c.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - -v={{ $c.logLevel | default "2" }}
          env:
            - name: LISTEN
              value: ':9090'
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.existingSecret | default (printf "agent-task-controller-%s" $c.name) }}
                  key: sentry-dsn
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $c.existingSecret | default (printf "agent-task-controller-%s" $c.name) }}
                  key: gateway-secret
            {{- with ($c.sentry | default dict).proxy }}
            - name: SENTRY_PROXY
              value: {{ . | quote }}
            {{- end }}
            - name: BRANCH
              value: {{ $c.branch | quote }}
            - name: TOPIC_PREFIX
              value: {{ $c.topicPrefix | quote }}
            - name: KAFKA_BROKERS
              value: {{ required "controllers[].kafkaBrokers is required" $c.kafkaBrokers | quote }}
            # GIT_REST_URL: explicit controllers[].gitRestUrl wins; otherwise
            # derived as http://vault-obsidian-<vaultName>:9090 — a quant service
            # naming convention. On any cluster whose git-rest Service is named
            # differently, set controllers[].gitRestUrl explicitly (see values.yaml).
            - name: GIT_REST_URL
              value: {{ $c.gitRestUrl | default (printf "http://vault-obsidian-%s:9090" (required "controllers[].vaultName is required" $c.vaultName)) | quote }}
            # Typed vault-api base URL. Controller >= v0.22.0 REQUIRES this and exits
            # at startup with "VAULT_API_URL is required" when it is empty, because it
            # builds a typed vaultapi.Client instead of writing git-rest keys directly.
            # Deliberately NOT derived from gitRestUrl: the two are different services
            # with different auth (vault-api takes a gateway secret, git-rest does not),
            # and a silent fallback would point the controller at an endpoint that
            # cannot answer its calls. Empty = unset, so a controller pinned below
            # v0.22.0 keeps working without this key.
            - name: VAULT_API_URL
              value: {{ $c.vaultApiUrl | default "" | quote }}
            - name: VAULT_NAME
              value: {{ required "controllers[].vaultName is required" $c.vaultName | quote }}
            - name: POLL_INTERVAL
              value: {{ $c.pollInterval | default "60s" | quote }}
            - name: TASK_DIR
              value: {{ $c.taskDir | quote }}
            - name: DATA_DIR
              value: '/data/bolt'
            - name: NO_SYNC
              value: "false"
            - name: AUTO_INJECT_TASK_IDENTIFIER
              value: {{ $c.autoInjectTaskIdentifier | quote }}
            {{- with $.Values.cluster }}
            - name: CLUSTER
              value: {{ . | quote }}
            {{- end }}
            {{- if and (hasKey $.Values "publishUntagged") (kindIs "bool" $.Values.publishUntagged) }}
            - name: PUBLISH_UNTAGGED
              value: {{ $.Values.publishUntagged | quote }}
            {{- end }}
            # Arbitrary per-controller env, for values this chart does not model as a
            # first-class key. Rendered last so a deliberate override of a
            # chart-rendered key wins (later entries win in a k8s env list), but
            # before NAMESPACE, which must stay the pod's own fieldRef.
            #
            # Needed first for HUMAN_ASSIGNEES: the controller retains a human_review
            # assignee only when it is in that set, and an unset variable means an
            # empty set — which reproduces the old clear-everything behaviour and
            # makes a human-owner fix deploy and do nothing. There was no way to set
            # it from values before this passthrough existed.
            {{- range $name, $value := ($c.env | default dict) }}
            {{- if has $name (list "LISTEN" "DATA_DIR" "NAMESPACE") }}
            {{- fail (printf "controllers[].env may not override the chart invariant %s: LISTEN must match the containerPort and both probes, DATA_DIR must stay inside the /data volume, and NAMESPACE must stay the pod's own fieldRef" $name) }}
            {{- end }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readiness
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: datadir
              mountPath: /data
            {{- if (($c.kafkaUser | default dict).enabled) }}
            {{- include "agent.kafkaCertVolumeMounts" $ | nindent 12 }}
            {{- end }}
      {{- if (($c.kafkaUser | default dict).enabled) }}
      {{- $ku := $c.kafkaUser }}
      {{- $userName := $ku.userName | default (printf "%s-agent-task-controller-%s" (include "agent.namespace" $) $c.name) }}
      volumes:
        {{- include "agent.kafkaCertVolumes" (dict "clientSecret" ($ku.clientSecret | default $userName) "caCertSecret" ($ku.caCertSecret | default "my-cluster-cluster-ca-cert")) | nindent 8 }}
      {{- end }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: [ReadWriteOnce]
        {{- with ($c.storage | default dict).storageClassName }}
        # Omitted when empty so the cluster's DEFAULT StorageClass is used;
        # an explicit "" would instead disable dynamic provisioning.
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ ($c.storage | default dict).size | default "1Gi" }}
{{- end }}
{{- end }}
