{{- if .Values.clusterAssigner.enabled }}
{{- $ca := .Values.clusterAssigner }}
{{- $ns := include "agent.namespace" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-assigner
  namespace: {{ $ns }}
  labels:
    app: cluster-assigner
    {{- include "agent.labels" . | nindent 4 }}
spec:
  schedule: {{ $ca.schedule | quote }}
  successfulJobsHistoryLimit: {{ $ca.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $ca.failedJobsHistoryLimit }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # The next scheduled run is the retry: a retrying failed pod would
      # otherwise make concurrencyPolicy Forbid skip the next tick.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: cluster-assigner
        spec:
          restartPolicy: Never
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: service
              image: "{{ .Values.image.registry }}/{{ $ca.image.repository }}:{{ $ca.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - -v={{ $ca.logLevel }}
              {{- with $ca.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: KAFKA_BROKERS
                  value: {{ required "clusterAssigner.kafkaBrokers is required" $ca.kafkaBrokers | quote }}
                - name: TOPIC_PREFIX
                  value: {{ $ca.topicPrefix | quote }}
                - name: GIT_REST_URL
                  value: {{ required "clusterAssigner.gitRestURL is required" $ca.gitRestURL | quote }}
                - name: GATEWAY_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ca.existingSecret | default (printf "agent-task-controller-%s" $ca.vault) }}
                      key: gateway-secret
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ca.existingSecret | default (printf "agent-task-controller-%s" $ca.vault) }}
                      key: sentry-dsn
                      # Optional for this component: a Secret without the key
                      # must not block pod start.
                      optional: true
                {{- with .Values.sentry.proxy }}
                - name: SENTRY_PROXY
                  value: {{ . | quote }}
                {{- end }}
                - name: TASK_GLOB
                  value: {{ $ca.taskGlob | quote }}
                - name: VAULT
                  value: {{ $ca.vault | quote }}
                - name: DEFAULT_CLUSTER_PROD
                  value: {{ $ca.defaultClusterProd | quote }}
                - name: DEFAULT_CLUSTER_DEV
                  value: {{ $ca.defaultClusterDev | quote }}
                - name: SUN_ROUTING
                  value: {{ $ca.sunRouting | quote }}
                - name: DRY_RUN
                  value: {{ $ca.dryRun | quote }}
                - name: SUN_API_URL
                  value: {{ $ca.sun.apiURL | quote }}
                - name: SUN_NAMESPACE
                  value: {{ $ca.sun.namespace | quote }}
                {{- if $ca.sunRouting }}
                {{- $sunSecret := $ca.sun.secretName | default "cluster-assigner-sun" }}
                - name: SUN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $sunSecret }}
                      key: sun-token
                - name: SUN_CA_DATA
                  valueFrom:
                    secretKeyRef:
                      name: {{ $sunSecret }}
                      key: sun-ca-data
                {{- end }}
              resources:
                {{- toYaml $ca.resources | nindent 16 }}
              {{- if $ca.kafkaUser.enabled }}
              volumeMounts:
                {{- include "agent.kafkaCertVolumeMounts" . | nindent 16 }}
              {{- end }}
          {{- if $ca.kafkaUser.enabled }}
          {{- $ku := $ca.kafkaUser }}
          {{- $userName := $ku.userName | default (printf "%s-cluster-assigner" $ns) }}
          volumes:
            {{- include "agent.kafkaCertVolumes" (dict "clientSecret" ($ku.clientSecret | default $userName) "caCertSecret" ($ku.caCertSecret | default "my-cluster-cluster-ca-cert")) | nindent 12 }}
          {{- end }}
{{- end }}
