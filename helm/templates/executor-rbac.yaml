{{- if .Values.executor.enabled }}
{{- $ns := include "agent.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
---
# ClusterRole is namespace-suffixed so dev + prod installs don't collide on the
# cluster-scoped object (executor manages the Config CRD it consumes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-task-executor-{{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-task-executor-{{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-task-executor-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: agent-task-executor
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  # Service StatefulSets (executor >= v0.18.0). The reconcile loop creates one per
  # Config whose spec.type is service, and removes it when a Config stops being one.
  # `delete` is granted from v0.18.1 onwards only, because that is the release in
  # which ServiceReconciler checks the object's Config controller ownerRef before
  # removing it — without that guard a job Config could delete any StatefulSet in
  # the namespace that happened to share its name. Grant the rule, but do not pin
  # an executor older than v0.18.1 alongside it.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, get, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [agent.benjamin-borbe.de]
    resources: [configs]
    verbs: [get, list, watch]
  # git-rest gateway secret read: the executor resolves GITREST_GATEWAY_SECRET
  # (a Secret NAME) to its `gateway-secret` data value via the K8s API at
  # startup (executor >= v0.11.0 reconcile loop).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-task-executor
subjects:
  - kind: ServiceAccount
    name: agent-task-executor
    namespace: {{ $ns }}
{{- end }}
