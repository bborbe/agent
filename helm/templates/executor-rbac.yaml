{{- if .Values.executor.enabled }}
{{- $ns := include "agent.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
---
# ClusterRole is namespace-suffixed so dev + prod installs don't collide on the
# cluster-scoped object (executor manages the Config CRD it consumes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-task-executor-{{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-task-executor-{{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-task-executor-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: agent-task-executor
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  # Service StatefulSets (executor >= v0.18.0). The reconcile loop creates one per
  # Config whose spec.type is service.
  #
  # `delete` is deliberately NOT granted here. The loop also removes the StatefulSet
  # when a Config stops being one, but that path deletes by name, and a StatefulSet's
  # name here is just the Config's name — so it is only safe on an executor that
  # checks the object's Config controller ownerRef first (v0.18.1+). The chart cannot
  # see which executor version it is paired with, so granting `delete` here would make
  # safety depend on a comment. Withholding it removes the coupling entirely: `get` is
  # enough for the guarded undeploy path to find nothing and return quietly, and no
  # executor version can delete by name through this Role.
  #
  # Grant `delete` only once the pairing is enforced rather than documented — the
  # platform's own gate is `check-executor-compat` in nuke/agent, which runs before
  # mirror+upgrade and can refuse an EXECUTOR_VERSION below the guarded release.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, get, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Pod log read (spec 021: the executor captures a failed Job's log tail into the
  # task's `## Failure` section). `pods/log` is a SEPARATE RBAC subresource — the
  # `pods` rule above does not cover it, so without this rule every log read is a
  # 403 and the capture silently produces an empty tail on every failure, which is
  # indistinguishable from a Job that logged nothing. `get` is the only verb the
  # read uses; `list`/`watch` are meaningless on a subresource.
  #
  # Accepted blast radius: this grant is namespace-scoped, so the executor can
  # read the log of ANY pod in the namespace, not only the Jobs it spawned.
  # Kubernetes RBAC cannot scope `pods/log` by resourceName here — pod names are
  # Job-generated at runtime and unknown at render time — so this is the minimum
  # grant that makes the capture work at all.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Pod quota read (executor >= v0.37.0). The executor bounds spawn admission by
  # the enforced pod capacity of the agent's own priority class, not only by the
  # Config's maxConcurrentJobs. Where the two disagree the quota is what actually
  # limits pods, so a cluster that admitted on the declared cap alone created Jobs
  # whose pods the quota refused: the Job never ran, its dispatch claim was held
  # and renewed, and the peer cluster was refused `lease not expired` on that task
  # for the whole hold (measured on nuke prod 2026-10-24: maxConcurrentJobs 5
  # against `github-pr-review-agent pods: 3`). `list` is the verb used; `get` is
  # granted so a future by-name read needs no chart change. Without this rule the
  # executor's read is refused and it falls back to the declared cap, which is the
  # old behaviour rather than an error.
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]
  - apiGroups: [agent.benjamin-borbe.de]
    resources: [configs]
    verbs: [get, list, watch]
  # git-rest gateway secret read: the executor resolves GITREST_GATEWAY_SECRET
  # (a Secret NAME) to its `gateway-secret` data value via the K8s API at
  # startup (executor >= v0.11.0 reconcile loop).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-task-executor
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-task-executor
subjects:
  - kind: ServiceAccount
    name: agent-task-executor
    namespace: {{ $ns }}
{{- range $sandboxNS := (include "agent.sandboxNamespaces" . | splitList ",") }}
---
# Sandbox-scoped grants: the executor, still in the control namespace, gets exactly
# the cross-namespace rights it needs inside this environment's sandbox namespaces
# and no more. No wildcard verbs, no cluster-scope — a widened grant here would
# widen the executor's blast radius past the sandbox boundary. One pair per declared
# domain (or the single sandbox namespace when no domains are declared).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-task-executor-sandbox
  namespace: {{ $sandboxNS }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  # Pod reads are not optional: the executor's pod-state classifier and deadline
  # sweeper watch the Pods of the Jobs it spawns (spec 043 — ImagePullBackOff,
  # eviction, crash-before-stdout). The control-namespace Role grants exactly
  # this; omitting it here makes every Pod read Forbidden once Jobs move into
  # the sandbox, which breaks zombie detection rather than failing loudly.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Pod log read in the JOB namespace (spec 021: the executor captures a failed
  # Job's log tail into the task's `## Failure` section). Same reasoning as the
  # `pods` rule directly above, and the same omission commit 3915f18 fixed: when
  # a Config sets `jobNamespace` the failed Job's pod lives HERE, so the read
  # happens here and the control-namespace grant is never consulted. Without
  # this rule every capture 403s and silently produces an empty tail — which
  # reads exactly like a Job that logged nothing.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Pod quota read in the JOB namespace (executor >= v0.37.0). `podQuotaFor`
  # resolves the ResourceQuota for the agent's priority class in the namespace
  # the Job is spawned into, so the read happens HERE, not in the control
  # namespace — the control-namespace grant alone is never the one consulted.
  # Without this rule every admission attempt logs `pod_quota_read_failed` and
  # falls back to the declared `maxConcurrentJobs`, which is the old behaviour
  # rather than an error: measured on nuke prod 2026-10-26, 50 failures in 30
  # minutes with `quota=0` on every `concurrency_admit` line, on a chart that had
  # already added the same rule to the control-namespace Role.
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-task-executor-sandbox
  namespace: {{ $sandboxNS }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-task-executor-sandbox
subjects:
  - kind: ServiceAccount
    name: agent-task-executor
    namespace: {{ $ns }}
{{- end }}
{{- end }}
