{{- if .Values.executor.enabled }}
# Allowlist + self-test for the egress proxy (spec 048). Kept in its own template
# file so the Deployment can hash it into a pod annotation: tinyproxy reads the
# filter only at startup, so without a checksum an allowlist edit would leave the
# running proxy enforcing the old list while the readiness sidecar ran the new
# script. The hash makes a ConfigMap change roll the Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-allowlist
  namespace: {{ include "agent.sandboxNamespace" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  # Domain allowlist (tinyproxy Filter file). One anchored regex per line, matched
  # against the bare CONNECT host; FilterDefaultDeny=Yes denies everything not listed.
  #
  # Seeded from claude-yolo's curated `files/tinyproxy-allowlist` (30 entries,
  # anchored `^...$` so `api.github.com.evil.com` cannot match) plus the two
  # claude-code-router upstreams `api.gpt.seibert.ai` and `api.seibert.ai`,
  # which the router calls and which no seed list carried — 32 entries total.
  # `api.minimax.io` is load-bearing: prod github-dark-factory-agent runs
  # ANTHROPIC_BASE_URL=https://api.minimax.io/anthropic.
  tinyproxy-allowlist: |
    ^.*\.github\.com$
    ^.*\.githubusercontent\.com$
    ^api\.anthropic\.com$
    ^api\.gpt\.seibert\.ai$
    ^api\.minimax\.io$
    ^api\.osv\.dev$
    ^api\.seibert\.ai$
    ^bitbucket\.seibert\.tools$
    ^claude\.ai$
    ^console\.anthropic\.com$
    ^dl-cdn\.alpinelinux\.org$
    ^files\.pythonhosted\.org$
    ^ghcr\.io$
    ^github\.com$
    ^host\.docker\.internal$
    ^go\.dev$
    ^marketplace\.visualstudio\.com$
    ^pkg-containers\.githubusercontent\.com$
    ^platform\.claude\.com$
    ^proxy\.golang\.org$
    ^pypi\.org$
    ^registry\.npmjs\.org$
    ^sentry\.io$
    ^statsig\.anthropic\.com$
    ^statsig\.com$
    ^storage\.googleapis\.com$
    ^sum\.golang\.org$
    ^update\.code\.visualstudio\.com$
    ^vllm\.seibert\.tools$
    ^vscode\.blob\.core\.windows\.net$
    ^vuln\.go\.dev$
    ^www\.python\.org$
  # Two-direction self-test, split across two probes by cost.
  #
  # The NEGATIVE check (a non-allowlisted domain must fail) is answered by the
  # proxy itself without any upstream connection, so it is cheap enough to run on
  # every readiness cycle and is what catches a broken-open allowlist.
  #
  # The POSITIVE check reaches a real upstream, and api.github.com rate-limits
  # unauthenticated clients to 60 requests/hour per source IP. Two replicas probing
  # every 60s would exhaust that in ~30 minutes and then hold BOTH pods NotReady,
  # emptying the Service and taking all agent egress down. It therefore runs from
  # the startup probe only: it still gates readiness (a pod that fails startup is
  # never Ready), but it cannot be re-run into a rate limit.
  selftest.sh: |
    #!/bin/sh
    set -u
    MODE="${1:-full}"
    PROXY="http://127.0.0.1:8888"
    # Negative: a non-allowlisted domain MUST fail (tinyproxy 403 => curl --fail
    # exits 22). Without --fail, a 403 is still exit 0 and this check is a no-op.
    if curl --proxy "$PROXY" --fail --connect-timeout 5 https://example.com >/dev/null 2>&1; then
      echo "selftest FAIL: non-allowlisted https://example.com was allowed (allowlist broken open)" >&2
      exit 1
    fi
    # Positive: an allowlisted domain MUST succeed. Startup probe only — see above.
    if [ "$MODE" = "full" ]; then
      if ! curl --proxy "$PROXY" --fail --connect-timeout 5 -o /dev/null https://api.github.com/zen; then
        echo "selftest FAIL: allowlisted https://api.github.com/zen was blocked (allowlist too tight)" >&2
        exit 1
      fi
    fi
    echo "selftest OK ($MODE)"
{{- end }}
