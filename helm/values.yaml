# agent chart values.
#
# Required per install: namespace, image registry/tag, executor.kafkaBrokers.
# Structural cluster divergence (keel, node affinity, private-registry pull
# secrets, empty-able topic prefix) is expressed as values so one chart installs
# on any cluster. Quant sets keel + node affinity + a mirror registry + pull
# secret; a generic cluster leaves those empty and pulls the public docker.io
# image directly.

# Namespace the components deploy into. Required (no default — the cluster owns it).
namespace: ""

# Sandbox: the namespace hosting agent Job pods, the egress proxy and the
# default-deny egress policy. Every key here is opt-in; an install that sets
# nothing renders exactly what it rendered before these values existed.
sandbox:
  # Explicit sandbox namespace name. Empty falls back to
  # "<namespace>-agents-sandbox", which is what every current install renders.
  namespace: ""
  # A map of sandbox namespace name to its egress peer set. When non-empty the
  # chart renders one Namespace and one `<name>-egress` default-deny policy per
  # entry, and the egress proxy renders once in `proxyNamespace`. Empty (the
  # default) renders today's single sandbox exactly, so no existing install
  # changes. Mutually exclusive with `namespace` above — declaring both fails
  # the render, because a fifth namespace or one silently ignored is ambiguous.
  #
  # Each entry takes an optional `peers` list naming destinations from the
  # fixed catalog: dns, router, pushgateway, sentry-proxy, vault-personal,
  # vault-openclaw, vault-trading, frontend-gateway, frontend-strategy,
  # vault-api, kafka, proxy. An unknown name fails the render. `dns` and
  # `proxy` are added to every domain unconditionally — they are how a pod
  # resolves anything and the only route to the public internet. OMITTING
  # `peers` renders today's full union (every catalog peer except proxy/dns
  # duplication), deliberately: the first apply of a domains install must not
  # narrow any agent's reach. An explicit `peers: []` renders only dns+proxy.
  domains: {}
  # Namespace hosting the single egress proxy (Deployment, Service, PDB,
  # allowlist ConfigMap and its two policies). Required when more than one
  # domain is declared, and must be one of the declared domains. With exactly
  # one domain it defaults to that domain. Setting it with no `domains`
  # declared fails the render — it would name a namespace nothing creates.
  proxyNamespace: ""
  # Namespace holding the sandbox policy's NON-agent peers: sentry-proxy, the
  # three vault-obsidian-* services, the two trading frontends and the optional
  # vault-API app. Empty falls back to the control namespace, which is where
  # every current install places them, so the render is unchanged unless set.
  # Set it when the control plane moves to its own namespace but those services
  # stay behind — otherwise the peers name a namespace that holds none of them
  # and the policy silently denies every sandboxed Job its vault and Sentry
  # proxy. The router is NOT covered by this key: it is a control-plane
  # component and moves with `namespace`.
  peerNamespace: ""
  kafka:
    # In-cluster Kafka: set this (and servicePort) to select brokers by
    # namespace instead of by the built-in nodeport addresses. Takes
    # precedence over them.
    namespace: ""
    # Optional pod selector narrowing the peer inside that namespace.
    # Empty opens EVERY pod in that namespace on servicePort — set it
    # whenever the namespace holds anything but the brokers.
    podLabels: {}
    # The brokers' CONTAINER port. A NetworkPolicy port matches the
    # destination pod, not the Service — the two usually share a number on
    # Strimzi listeners, but where they differ this silently matches nothing.
    servicePort: 0
  # app.kubernetes.io/instance value the router peer selects.
  # Empty falls back to "claude-code-router-<namespace>".
  routerInstance: ""
  # When set, render an extra egress peer selecting this `app` label on
  # port 9090. Set on sun to "vault-api-openclaw", whose vault service
  # carries that label rather than a vault-obsidian-* one.
  vaultApiApp: ""
  # When true, also render each agent's Secret and PVC into the sandbox
  # namespace, gated on executor.enabled. Only chart-rendered objects are
  # copied: an agent referencing an externally managed Secret via
  # `secretName` renders no Secret, so the operator must still place that
  # Secret in the sandbox namespace by hand. A copied PVC is a NEW, EMPTY
  # volume, not a view of the control-namespace claim — data written to the
  # original is not visible in the sandbox copy. In domains mode
  # (`sandbox.domains` declared) the copy follows the agent's `jobNamespace`
  # and renders only when that names a declared domain; with no domains it
  # targets the single `sandbox.namespace` regardless of `jobNamespace`.
  renderAgentStorage: false

# Image coordinates. Default to the public Docker Hub image; a self-sufficient
# cluster overrides registry to its in-cluster mirror.
image:
  registry: docker.io
  # Repository is per-component; the executor's is set here. registry/repository:tag.
  pullPolicy: IfNotPresent
  # Private-registry pull secret(s), e.g. [{name: docker}]. Empty for public docker.io.
  pullSecrets: []

# keel auto-redeploy annotations (quant polls the registry). Off by default —
# versioned deploys don't need it; bump image.tag + re-apply instead.
keel:
  enabled: false
  pollSchedule: "@every 1m"

# Node affinity passthrough (quant pins pods to a node_type=<namespace> node).
# Empty = no affinity (generic clusters). Set the full affinity object here.
affinity: {}

# Extra pod annotation used by quant to force a rollout (value of RANDOM). Empty = omit.
rolloutNonce: ""

# Egress proxy (spec 048).
egressProxy:
  # Inject HTTP_PROXY/HTTPS_PROXY/NO_PROXY into every Job agent's Config. Default
  # OFF, and it must stay off until the executor actually spawns Jobs into
  # <namespace>-agents-sandbox (spec 002, `ConfigSpec.JobNamespace`). While agents
  # still run in the control namespace, `egress-proxy-ingress` does not admit them,
  # so injecting the proxy would point every agent's HTTP(S) traffic at a proxy
  # that denies it — taking all agent egress down. Flip it per environment once
  # `kubectlnukedev -n dev get config.agent.benjamin-borbe.de -o jsonpath='{..spec.jobNamespace}'`
  # shows the sandbox namespace.
  injectAgentEnv: false
  # Optional extra ingress peer for `egress-proxy-ingress`. NOT needed for the
  # chart's own probes: both are exec probes that curl 127.0.0.1 inside the pod,
  # and pod loopback never crosses the interface NetworkPolicy filters. Set this
  # only if you add httpGet/TCP probes or another in-cluster client that must
  # reach the proxy. Empty renders no extra peer.
  nodeCidr: ""

# Fleet-wide Sentry proxy URL, rendered as `SENTRY_PROXY` into every agent Job's
# Config.spec.env (see templates/agents.yaml). A per-agent `agents[].sentry.proxy`
# overrides it; an agent that sets `SENTRY_PROXY` in its own `env:` map wins over
# both. The default is deliberately empty, so the key renders only when the
# install sets it — which makes THIS the load-bearing key: setting only a
# per-agent value, or only this one, are different outcomes, and an install that
# sets neither renders no SENTRY_PROXY at all. Set it once per cluster to cover
# every agent, including ones added later.
sentry:
  proxy: ""

# Cluster this release is installed on (e.g. nukedev, nukeprod, sun). When
# non-empty it is rendered as the `CLUSTER` env on every executor and every
# controller; controllers publish only tasks whose `cluster:` frontmatter
# matches this value. Requires agent-task-controller >= v0.14.0 and
# agent-task-executor >= v0.19.0. Empty (default) renders nothing.
cluster: ""

# publishUntagged: rendered as the `PUBLISH_UNTAGGED` env (quoted "true"/"false")
# on every controller only when this key is SET — unset renders nothing and the
# controller's own default applies. Set it to false on clusters that must run
# only explicitly tagged tasks (e.g. sun), so tasks without a `cluster:`
# frontmatter are not published there. Deliberately commented out: a default
# here would make "unset" and false indistinguishable. Requires
# agent-task-controller >= v0.14.0.
# publishUntagged: false

executor:
  enabled: true
  image:
    repository: bborbe/agent-task-executor
    # tag defaults to Chart.appVersion when empty.
    tag: ""
  logLevel: "2"
  # Kafka bootstrap brokers. Required.
  kafkaBrokers: ""
  # Explicit Kafka topic prefix. Empty = unprefixed (per-stage-cluster / Octopus).
  # Quant sets "develop" (dev) / "master" (prod).
  topicPrefix: ""
  # Stage label forwarded as BRANCH env (non-topic uses: image tag hints, stage filters).
  branch: ""
  # Vault this executor serves. Emitted as the VAULT_NAME env; the executor binary
  # >= v0.7.0 REQUIRES a non-empty value at startup (empty -> crash-loop). The
  # legacy v0.6.x line ignores it. Empty default keeps v0.6.x installs rendering
  # unchanged; v0.7+ installs must set it (nuke enforces via check-executor-compat).
  vaultName: ""
  # Vault whose task events this executor owns, matched against the
  # controller-stamped Task.Vault (executor >= v0.24.0). Emitted as TASK_VAULT
  # only when set; unset lets the binary default it to VAULT_NAME. Set it where
  # VAULT_NAME is not a vault slug (the personal executor runs VAULT_NAME=shared).
  # Per-entry executors[].taskVault overrides this.
  taskVault: ""
  sentry:
    # Sentry proxy cluster URL. Optional.
    proxy: ""
    # Sentry DSN secret value. When set, the chart creates a Secret; quant resolves
    # this from teamvault and passes it via --set-string. Leave empty + set
    # existingSecret to reference a Secret managed outside the chart.
    dsn: ""
  # Name of a pre-existing Secret providing key `sentry-dsn`. When set, the chart
  # does NOT create the Secret and reads SENTRY_DSN from this one.
  existingSecret: ""
  # git-rest vault reader config (executor >= v0.11.0 reconcile loop). Mirrors the
  # controllers' GIT_REST_URL wiring.
  # gitRestUrl: git-rest base URL for the vault this executor serves. Defaults to
  # http://vault-obsidian-<vaultName>:9090; the shared executor (vaultName=shared)
  # must set it explicitly to its vault's git-rest (e.g.
  # http://vault-obsidian-personal:9090).
  gitRestUrl: ""
  # gitRestGatewaySecret: NAME of the K8s Secret carrying the git-rest gateway
  # secret (data key `gateway-secret`). The executor reads the value itself via
  # the K8s API at startup (executor-rbac.yaml grants `secrets: get`). Empty =
  # gateway auth disabled.
  gitRestGatewaySecret: ""
  # taskGlob: git-rest single-level glob selecting the vault task files the
  # reconcile loop evaluates. Consumer-supplied — the chart asserts no vault
  # folder layout. Empty = no glob configured.
  taskGlob: ""
  # consumerGroup: rendered as the `CONSUMER_GROUP` env on the executor when
  # non-empty. Gives each Kafka consumer its own consumer group (e.g.
  # agent-task-executor-sun) so executors on different clusters do not share
  # offsets. Empty = nothing rendered.
  consumerGroup: ""
  # stageFilter: rendered as the `STAGE_FILTER` env (quoted "true"/"false") on the
  # executor only when the key is set — `false` is honoured, unset renders
  # nothing (the executor's own default `true` applies). `false` makes the
  # executor ignore the task `stage:` field; set it only on a cluster whose
  # controller already scopes tasks by cluster (e.g. sun). nuke dev/prod leave
  # it unset. Requires agent-task-executor >= v0.21.0.
  # stageFilter: false
  # runUntagged: rendered as the `RUN_UNTAGGED` env (quoted "true"/"false") on the
  # executor only when the key is set — `false` is honoured, unset renders
  # nothing (the executor's own default `true` applies). `false` makes the
  # executor skip every task without a `cluster:` field; set it only on a
  # cluster whose controller publishes no untagged tasks (e.g. sun). nuke
  # dev/prod leave it unset. Requires agent-task-executor >= v0.22.0.
  # runUntagged: false
  # reconcilePassTimeout / reconcileInterval: rendered as the
  # `RECONCILE_PASS_TIMEOUT` / `RECONCILE_INTERVAL` env (Go durations, e.g.
  # "150s") only when set; unset leaves the executor defaults (45s / 60s). Raise
  # them where a full reconcile pass over the vault outlasts 45s (sun reads the
  # openclaw vault over the git-rest ingress). Requires agent-task-executor
  # >= the release carrying bborbe/agent-task-executor#90.
  # reconcilePassTimeout: "150s"
  # reconcileInterval: "180s"
  # Pod-level securityContext. Empty by default — runAsNonRoot/runAsUser/fsGroup
  # depend on what the image supports, so clusters opt in (e.g. runAsNonRoot: true,
  # runAsUser: 65534, fsGroup: 65534).
  podSecurityContext: {}
  # Container-level securityContext. Safe hardening defaults that don't depend on
  # the image's user; override as needed.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 20Mi
    limits:
      cpu: 500m
      memory: 50Mi
  # Strimzi KafkaUser + mTLS client-cert mounts for the executor. Off by default
  # → plaintext Kafka, no KafkaUser, no cert volumes (quant). When enabled the
  # chart emits a KafkaUser CR (type: tls) in strimziNamespace AND mounts the
  # client cert/key + cluster CA at the fixed paths /client-cert/file,
  # /client-key/file, /server-cert/file that github.com/bborbe/kafka reads when
  # kafkaBrokers uses the tls:// scheme. Set kafkaBrokers to tls://…:9093 too.
  # The chart references the secrets by name only — Strimzi issues the user secret
  # and an external syncer must place it (+ the CA) into this namespace.
  kafkaUser:
    enabled: false
    # Strimzi Kafka CR name (KafkaUser label) + the operator's namespace.
    cluster: my-cluster
    strimziNamespace: strimzi
    # KafkaUser CR name. Empty = derived "<namespace>-agent-task-executor".
    userName: ""
    # Secret (in this namespace) holding user.crt/user.key. Empty = same as the
    # KafkaUser name (Strimzi names the issued secret after the user).
    clientSecret: ""
    # Secret (in this namespace) holding the cluster CA as ca.crt.
    caCertSecret: my-cluster-cluster-ca-cert

# Executors: values-driven LIST of Deployments, each serving exactly one vault.
# Each enabled entry emits an `agent-task-executor-<name>` Deployment (single
# replica = one consumer group / offset domain / dedup state per vault). The real
# per-vault install adds one entry per vault; a generic install leaves the list
# empty (executors: []) so the single legacy executor renders unchanged
# (executor.enabled path). Reuses the shared image.registry / keel / affinity /
# pullSecrets values; every optional per-entry field falls back to the matching
# executor.* value.
executors: []
  # - name: openclaw               # instance name → workload agent-task-executor-<name>
  #                               # and pod label vault: <name>. Required. No chart-side
  #                               # validation; two entries sharing a name render two
  #                               # same-named manifests (last-write-wins on apply).
  #   enabled: true                # default true; false skips the entry.
  #   # Vault this executor serves. REQUIRED — becomes the VAULT_NAME env; empty is
  #   # rejected at render time. The slug pattern ^[a-z][a-z0-9-]*$ is validated by
  #   # the executor binary (>= v0.7.0) at startup, NOT by the chart.
  #   vaultName: openclaw
  #   # Stage label forwarded as BRANCH env. Default executor.branch.
  #   branch: ""
  #   # Explicit Kafka topic prefix. Default executor.topicPrefix. Passes through
  #   # verbatim — the chart does NOT derive {stage}-{vault}. Per-vault isolation
  #   # requires setting this to {stage}-{vault} so the executor consumes
  #   # {prefix}-agent-task-v1-event and publishes {prefix}-agent-task-v1-request.
  #   topicPrefix: develop-openclaw
  #   # Kafka bootstrap brokers. Default executor.kafkaBrokers. Use tls://…:9093
  #   # with the shared executor.kafkaUser block.
  #   kafkaBrokers: kafka:9092
  #   image:
  #     repository: bborbe/agent-task-executor
  #     tag: ""                     # empty => Chart.appVersion (default executor.image)
  #   logLevel: "2"                 # default executor.logLevel
  #   consumerGroup: ""             # default executor.consumerGroup
  #   stageFilter: false            # default executor.stageFilter; renders only when set
  #   runUntagged: false            # default executor.runUntagged; renders only when set
  #   reconcilePassTimeout: ""      # default executor.reconcilePassTimeout; renders only when set
  #   reconcileInterval: ""         # default executor.reconcileInterval; renders only when set
  #   sentry:
  #     # Sentry proxy cluster URL. Default executor.sentry.proxy. NOTE: sentry.dsn
  #     # is NOT a per-entry field — the chart never creates per-vault Secrets;
  #     # SENTRY_DSN is always read from a Secret (see existingSecret below).
  #     proxy: ""
  #   # Name of a pre-existing Secret providing key sentry-dsn. Default
  #   # executor.existingSecret, then the shared agent-task-executor Secret.
  #   existingSecret: ""
  #   # Pod-level securityContext. Default executor.podSecurityContext.
  #   podSecurityContext: {}
  #   # Container-level securityContext. Default executor.securityContext.
  #   securityContext:
  #     allowPrivilegeEscalation: false
  #     readOnlyRootFilesystem: false
  #     capabilities:
  #       drop: [ALL]
  #     seccompProfile:
  #       type: RuntimeDefault
  #   resources:
  #     requests: {cpu: 20m, memory: 20Mi}
  #     limits: {cpu: 500m, memory: 50Mi}
  # - name: personal
  #   enabled: true
  #   vaultName: personal
  #   branch: ""
  #   topicPrefix: develop-personal
  #   kafkaBrokers: kafka:9092
  #   image:
  #     repository: bborbe/agent-task-executor
  #     tag: ""
  #   logLevel: "2"
  #   consumerGroup: ""             # default executor.consumerGroup
  #   stageFilter: false            # default executor.stageFilter; renders only when set
  #   runUntagged: false            # default executor.runUntagged; renders only when set
  #   reconcilePassTimeout: ""      # default executor.reconcilePassTimeout; renders only when set
  #   reconcileInterval: ""         # default executor.reconcileInterval; renders only when set
  #   sentry:
  #     proxy: ""
  #   existingSecret: ""
  #   podSecurityContext: {}
  #   securityContext:
  #     allowPrivilegeEscalation: false
  #     readOnlyRootFilesystem: false
  #     capabilities:
  #       drop: [ALL]
  #     seccompProfile:
  #       type: RuntimeDefault
  #   resources:
  #     requests: {cpu: 20m, memory: 20Mi}
  #     limits: {cpu: 500m, memory: 50Mi}
  # NOTE: there is NO per-entry kafkaUser — executor mTLS stays driven by the
  # single shared executor.kafkaUser block for all per-vault executors (per-vault
  # Kafka credentials are a future separate spec).

# Controllers: values-driven LIST of StatefulSets, each watching one vault's
# tasks, syncing a git-rest vault, and publishing work to Kafka. Each entry emits
# an `agent-task-controller-<name>` StatefulSet + Service + Secret. The real quant
# cluster runs two (openclaw + personal); a generic install adds the controllers
# it needs. Reuses the shared image.registry / keel / affinity / pullSecrets
# values; only per-controller coordinates live here. Empty by default so an
# executor-only install renders no controllers.
controllers: []
  # - name: openclaw               # instance name → workload agent-task-controller-<name>
  #   enabled: true
  #   image:
  #     repository: bborbe/agent-task-controller
  #     tag: ""                     # empty => Chart.appVersion
  #   logLevel: "2"
  #   # Vault name this controller drives. Required. Also derives the default
  #   # GIT_REST_URL (http://vault-obsidian-<vaultName>:9090) when gitRestUrl is empty.
  #   vaultName: openclaw
  #   # Explicit git-rest base URL. Empty = derive from vaultName as
  #   # http://vault-obsidian-<vaultName>:9090.
  #   # IMPORTANT: that derivation hard-codes the quant service naming convention
  #   # (a `vault-obsidian-<vault>` Service on port 9090). If your git-rest/Obsidian
  #   # API Service is named differently the controller will fail to reach it with no
  #   # install-time warning — set this explicitly on any non-quant cluster.
  #   gitRestUrl: ""
  #   # Sub-path inside the vault holding task files. Empty = vault root.
  #   taskDir: ""
  #   # Stage label forwarded as BRANCH env. Empty = unset.
  #   branch: ""
  #   # Explicit Kafka topic prefix. Empty = unprefixed. Quant sets develop / master.
  #   topicPrefix: ""
  #   # Kafka bootstrap brokers. Required. Use tls://…:9093 with kafkaUser below.
  #   kafkaBrokers: kafka:9092
  #   # Per-controller Strimzi KafkaUser + mTLS client-cert mounts. Off by default
  #   # → plaintext, no CR, no cert volumes. When enabled: emits a KafkaUser CR
  #   # (type: tls) in strimziNamespace AND mounts client cert/key + cluster CA at
  #   # /client-cert/file, /client-key/file, /server-cert/file. Secrets referenced
  #   # by name only (Strimzi issues them; an external syncer places them here).
  #   kafkaUser:
  #     enabled: false
  #     cluster: my-cluster
  #     strimziNamespace: strimzi
  #     userName: ""       # empty = derived "<namespace>-agent-task-controller-<name>"
  #     clientSecret: ""   # empty = same as the KafkaUser name
  #     caCertSecret: my-cluster-cluster-ca-cert
  #   # Auto-inject a task identifier into created tasks. String "true"/"false".
  #   autoInjectTaskIdentifier: "false"
  #   # Vault poll interval. Default 60s.
  #   pollInterval: "60s"
  #   # BoltDB persistent volume (volumeClaimTemplates). storageClassName defaults to
  #   # "" = the cluster's default StorageClass (portable). quant sets "local-path"
  #   # in its values overlay; that requires the Local Path Provisioner and is
  #   # single-node oriented — do NOT default it here or multi-node clusters fail to
  #   # bind the PVC.
  #   storage:
  #     size: 1Gi
  #     storageClassName: ""
  #   sentry:
  #     # Sentry proxy cluster URL. Optional.
  #     proxy: ""
  #     # Sentry DSN secret value. When set (and existingSecret empty), the chart
  #     # creates the Secret; quant resolves it from teamvault via --set-string.
  #     dsn: ""
  #   # Gateway secret value (key gateway-secret). Same Secret as sentry-dsn.
  #   gatewaySecret: ""
  #   # Name of a pre-existing Secret providing keys sentry-dsn + gateway-secret.
  #   # When set, the chart does NOT create the Secret.
  #   existingSecret: ""
  #   # Pod-level securityContext. Empty by default — clusters opt in.
  #   podSecurityContext: {}
  #   # Container-level securityContext. Same safe hardening defaults as the executor.
  #   securityContext:
  #     allowPrivilegeEscalation: false
  #     readOnlyRootFilesystem: false
  #     capabilities:
  #       drop: [ALL]
  #     seccompProfile:
  #       type: RuntimeDefault
  #   resources:
  #     requests: {cpu: 20m, memory: 20Mi}
  #     limits: {cpu: 500m, memory: 50Mi}
  # - name: personal
  #   enabled: true
  #   image:
  #     repository: bborbe/agent-task-controller
  #     tag: ""
  #   logLevel: "2"
  #   vaultName: personal
  #   gitRestUrl: ""
  #   taskDir: ""
  #   branch: ""
  #   topicPrefix: ""
  #   kafkaBrokers: kafka:9092
  #   autoInjectTaskIdentifier: "false"
  #   pollInterval: "60s"
  #   storage:
  #     size: 1Gi
  #     storageClassName: ""
  #   sentry:
  #     proxy: ""
  #     dsn: ""
  #   gatewaySecret: ""
  #   existingSecret: ""
  #   podSecurityContext: {}
  #   securityContext:
  #     allowPrivilegeEscalation: false
  #     readOnlyRootFilesystem: false
  #     capabilities:
  #       drop: [ALL]
  #     seccompProfile:
  #       type: RuntimeDefault
  #   resources:
  #     requests: {cpu: 20m, memory: 20Mi}
  #     limits: {cpu: 500m, memory: 50Mi}

# Leaf agents: values-driven list. Each entry emits a Config CR + Secret + PVC +
# PriorityClass (cluster-scoped) + ResourceQuota (caps concurrent pods). Empty by
# default — a base install ships the framework; each cluster adds the agents it
# runs. Uncomment and copy the example (real agent-claude shape) per agent.
agents: []
  # - name: agent-claude          # object name + PriorityClass + PVC + Secret name
  #   enabled: true
  #   assignee: claude-agent      # Config.spec.assignee (who claims matching tasks)
  #   image: bborbe/agent-claude  # repo only; registry from image.registry
  #   tag: v0.1.1                 # empty => Chart.appVersion
  #   heartbeat: 5m               # liveness heartbeat interval
  #   zombieJobTimeoutSeconds: 5400   # OPTIONAL: Job deadline (seconds); omit for the
  #                                 # executor default (1800). Must exceed the agent's
  #                                 # own internal wait, or its Job dies first.
  #   rerunOnLostClaim: false       # OPTIONAL: Config.spec.rerunOnLostClaim. `false` stops
  #                                 # the executor re-running a task after this agent's
  #                                 # claim is lost (no second session). Rendered whenever
  #                                 # the key is set, `false` included; omit for the
  #                                 # executor default.
  #   jobNamespace: dev-agents-sandbox   # OPTIONAL: Config.spec.jobNamespace. Runs this
  #                                 # agent's Jobs in that namespace instead of the
  #                                 # executor's own. It must already exist and already
  #                                 # hold this agent's PVC and Secret: either place them
  #                                 # there yourself, or point this at the chart's own
  #                                 # sandbox namespace (`sandbox.namespace`, default
  #                                 # `<namespace>-agents-sandbox`) and set
  #                                 # `sandbox.renderAgentStorage: true`, which renders
  #                                 # the chart-managed copies into THAT namespace. In
  #                                 # domains mode (`sandbox.domains` declared),
  #                                 # renderAgentStorage copies the Secret and PVC into
  #                                 # the sandbox this jobNamespace names, and only when
  #                                 # that name is a declared domain; with no domains the
  #                                 # copy still targets the single sandbox.namespace.
  #                                 # Must be a valid DNS-1123 label
  #                                 # (lowercase alphanumerics and `-`, at most 63
  #                                 # characters) — the executor's Config CRD schema
  #                                 # rejects anything else at apply time — and must
  #                                 # differ from the executor's namespace, which the
  #                                 # executor rejects by spawning no Job. Omit to keep
  #                                 # the executor-namespace default. Requires
  #                                 # agent-task-executor >= v0.31.0.
  #   type: service               # OPTIONAL: `job` (default) or `service`. A `service`
  #                               # agent is reconciled as a long-running workload and is
  #                               # exempt from the taskType requirement below — leave
  #                               # taskTypes and trigger* unset for one.
  #   taskTypes: [llm, healthcheck]
  #   triggerPhases: [planning, execution, ai_review]
  #   triggerStatuses: [in_progress]
  #   secretName: agent-claude    # OPTIONAL: Config.spec.secretName. Defaults to
  #                               # `name`. Set when the existing Secret has a
  #                               # different name (e.g. agent-backtest-agent → agent-backtest).
  #   volumeMountPath: /home/claude/.claude   # OPTIONAL. When set → volumeClaim +
  #                               # PVC are emitted. OMIT entirely for a stateless
  #                               # agent (no PVC, no volumeClaim) — e.g. a backtest runner.
  #   volumeClaim: agent-claude   # OPTIONAL: PVC name. Defaults to `name`.
  #   storageSize: 1Gi            # PVC size (default 1Gi)
  #   storageClassName: ""        # OPTIONAL PVC class; empty => cluster default (omitted)
  #   configMapName: easy-agent-goreleaser   # OPTIONAL: ConfigMap mounted into the Job
  #                               # and named by Config.spec.configMapName. The chart
  #                               # renders the REFERENCE only — it does not create the
  #                               # ConfigMap, so the object must already exist in the
  #                               # namespace (apply it from its own manifest).
  #   configMapMountPath: /agent  # OPTIONAL: where that ConfigMap is mounted.
  #   configMapItems:             # OPTIONAL: key → path projection within the mount.
  #     - key: prompt.md
  #       path: prompt.md
  #   env:                        # plain env injected into the Config
  #     ALLOWED_TOOLS: WebSearch,WebFetch,Read,Grep
  #   secretEnv:                  # OPTIONAL: rendered into a per-agent Secret (base64).
  #                               # OMIT to reference an existing (e.g. teamvault-managed)
  #                               # Secret via secretName instead of creating one.
  #     SENTRY_DSN: dummy
  #     ANTHROPIC_AUTH_TOKEN: dummy
  #   sentry:                     # OPTIONAL: per-agent Sentry proxy override, rendered
  #     proxy: http://sentry-proxy.ns.svc.cluster.local:9090
  #                               # as SENTRY_PROXY. Defaults to the root `sentry.proxy`;
  #                               # set it only when this agent needs a DIFFERENT proxy
  #                               # host than the fleet's. An agent whose `env:` map
  #                               # already carries SENTRY_PROXY keeps its own value.
  #   resources:                  # OPTIONAL — omit for an agent with no resource block
  #     requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
  #     limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
  #   priorityValue: 500          # PriorityClass value (default 500)
  #   concurrency: 1              # max concurrent pods via ResourceQuota (default 1)

# recurring-task-creator: cron-like StatefulSet that reads Schedule CRs and
# publishes recurring tasks to Kafka. Off by default — only clusters running the
# recurring pipeline enable it. Reuses shared image.registry / keel / affinity.
recurringTaskCreator:
  enabled: false
  image:
    repository: bborbe/recurring-task-creator
    # tag defaults to Chart.appVersion when empty.
    tag: ""
  logLevel: "2"
  # Stage label (STAGE env). Empty = unset.
  stage: ""
  # Explicit Kafka topic prefix. Empty = unprefixed.
  topicPrefix: ""
  # Kafka bootstrap brokers. Required when enabled.
  kafkaBrokers: ""
  # Dry-run mode (string "true"/"false"). "false" = actually publish.
  dryRun: "false"
  sentry:
    # Sentry proxy cluster URL. Optional.
    proxy: ""
    # Sentry DSN secret value. When set (and existingSecret empty), chart creates
    # the Secret providing key sentry-dsn.
    dsn: ""
  # Name of a pre-existing Secret providing key sentry-dsn. When set, no Secret
  # is created.
  existingSecret: ""
  # Node affinity override. Empty = fall back to the global .Values.affinity.
  # recurring-task-creator often pins to a different node pool than the executor/
  # controllers (e.g. quant: node_type=agent here vs node_type=<stage> globally).
  affinity: {}
  # Image pull secret override. Empty = fall back to the global image.pullSecrets.
  # (quant's recurring uses `docker-quant` while the rest use `docker`.)
  pullSecrets: []
  # Pod-level securityContext. fsGroup 65534 (nobody) so the emptyDir /tmp is
  # group-writable by the non-root user.
  podSecurityContext:
    fsGroup: 65534
  # Container-level securityContext. Hardened + runs strictly as non-root nobody
  # with a read-only root filesystem (writes only to the /tmp emptyDir).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 20Mi
    limits:
      cpu: 200m
      memory: 100Mi
  # Strimzi KafkaUser for mTLS Kafka auth. Off by default — non-Strimzi clusters
  # manage Kafka credentials outside the chart. cluster/strimziNamespace are the
  # Strimzi operator's Kafka CR name + namespace.
  # NOTE: the KafkaUser is created in `strimziNamespace` (default "strimzi"), NOT
  # the app namespace — if Strimzi runs elsewhere and this is wrong, the user is
  # created in the wrong place and mTLS auth silently fails. It also means
  # `kubectl get kafkausers -n <app-ns>` won't list it; look in strimziNamespace.
  # When enabled the chart ALSO mounts the client cert/key + cluster CA at the
  # fixed /client-cert/file, /client-key/file, /server-cert/file paths (set
  # kafkaBrokers to tls://…:9093). Secrets are referenced by name only.
  kafkaUser:
    enabled: false
    cluster: my-cluster
    strimziNamespace: strimzi
    # KafkaUser CR name. Empty = derived "<namespace>-recurring-task-creator".
    userName: ""
    # Secret (in this namespace) holding user.crt/user.key. Empty = same as the
    # KafkaUser name (Strimzi names the issued secret after the user).
    clientSecret: ""
    # Secret (in this namespace) holding the cluster CA as ca.crt.
    caCertSecret: my-cluster-cluster-ca-cert

# A2A worker controller: the k8s-backend A2A controller (github.com/bborbe/a2a-worker-controller).
# Each `create` writes one `type: service` agent Config, cloned from `workerTemplate`, which the
# executor reconciles into a per-task worker pod. Off by default — an install that wants A2A
# worker spawning on this cluster enables it. Emits a Deployment + Service + Secret + RBAC, and
# an Ingress when ingressHost is set.
a2aWorkerController:
  enabled: false
  # Instance name → workloads `a2a-worker-controller-<name>`.
  name: default
  image:
    repository: bborbe/a2a-worker-controller
    # No chart-level default: the controller is versioned independently of this chart.
    tag: ""
  logLevel: "2"
  replicas: 1
  backend: k8s
  # The agent Config cloned for each worker pod.
  workerTemplate: claude-interactive
  # Image the worker pods run. Required by the binary even on this backend, which takes the
  # image from the template Config instead; the value is never used to start a worker.
  workerImage: ""
  # Public URL advertised in the controller's agent card. Required.
  publicUrl: ""
  # Scheduling + egress knobs that are cluster-specific. Empty = omit.
  workerPriorityClass: ""
  egressAllow: ""
  # Ingress. Empty ingressHost = no Ingress emitted.
  ingressHost: ""
  ingressClassName: traefik
  tlsSecretName: ""
  # Existing Secret holding a2a-auth-token / teamvault-user / teamvault-pass / sentry-dsn.
  # Empty = the chart renders one from the values below, which the caller supplies at apply
  # time (resolved from TeamVault), never from a committed file.
  existingSecret: ""
  authToken: ""
  teamvaultUrl: ""
  teamvaultUser: ""
  teamvaultPass: ""
  sentry:
    dsn: ""
    # Sentry proxy cluster URL. Empty = no SENTRY_PROXY emitted.
    proxy: ""
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi
